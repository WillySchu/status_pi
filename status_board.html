:root {
  --board: #0e3229;       /* solder-mask green */
  --board-deep: #09261f;
  --trace: #2e6e59;
  --silk: #f1eee3;        /* silkscreen white */
  --silk-dim: #9cc0b1;
  --pad: #e3be63;         /* gold pad */
  --caution: #f5b342;
  --fault: #f2554f;
  --ink: #1d0d08;         /* text on a lit tile */

  /* Sized so the layout fills an 800x480 panel; scales with the screen. */
  font-size: min(2.5vw, 4.2vh);
}
@media (orientation: portrait) {
  :root { font-size: min(3.6vw, 2.4vh); }
}

* { box-sizing: border-box; }

html, body { height: 100%; margin: 0; }

body {
  display: grid;
  grid-template-rows: auto 1fr;
  overflow: hidden;
  background: var(--board);
  color: var(--silk);
  font-family: "B612", "DejaVu Sans", "Liberation Sans", sans-serif;
  font-variant-numeric: tabular-nums;
  line-height: 1.25;
  cursor: none;
  user-select: none;
  -webkit-user-select: none;
}

/* Verdict strip: quiet when all is well, a lit tile when it is not. */
.verdict {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 1.2rem;
  padding: 0.85rem 1.2rem 0.9rem;
  background: var(--board-deep);
  border-bottom: 2px solid var(--trace);
}
.verdict-text {
  margin: 0;
  font-size: 1.7rem;
  font-weight: 700;
  line-height: 1.15;
}
.clock {
  flex: none;
  color: var(--silk-dim);
  white-space: nowrap;
}
.verdict.is-caution { background: var(--caution); border-color: var(--caution); color: var(--ink); }
.verdict.is-fault { background: var(--fault); border-color: var(--fault); color: var(--ink); }
.verdict.is-caution .clock,
.verdict.is-fault .clock { color: inherit; }

/* A new alert pulses until someone taps the screen to acknowledge it. */
.verdict.is-unacknowledged { animation: annunciate 1.6s ease-in-out infinite; }
@keyframes annunciate {
  50% { filter: brightness(0.5); }
}
@media (prefers-reduced-motion: reduce) {
  .verdict.is-unacknowledged { animation: none; }
}

.panels {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr));
  align-content: start;
  gap: 1rem;
  padding: 1rem 1.2rem 1.2rem;
  overflow: auto;
}
@media (orientation: portrait) {
  .panels { grid-template-columns: 1fr; }
}

.panel {
  display: flex;
  flex-direction: column;
  min-width: 0;
  border: 2px solid var(--trace);
}
.panel-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 0 1rem;
  padding: 0.7rem 1rem 0.6rem;
}
.panel-name {
  margin: 0;
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--pad);
  overflow-wrap: anywhere;
}
.panel-note { margin: 0; font-size: 0.9rem; color: var(--silk-dim); }

.checks { list-style: none; margin: 0; padding: 0; }
.check {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 0 1rem;
  padding: 0.5rem 1rem;
  border-top: 1px solid var(--trace);
}
.check-name { overflow-wrap: anywhere; }
.check-state { margin-left: auto; text-align: right; }
.check-detail { display: block; font-size: 0.85rem; color: var(--silk-dim); }
.check.is-caution { background: var(--caution); color: var(--ink); }
.check.is-fault { background: var(--fault); color: var(--ink); }
.check.is-caution .check-detail,
.check.is-fault .check-detail { color: inherit; }

.vitals {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 0.2rem 0.3rem;
  margin: auto 0 0;   /* sits at the foot of the panel so neighbours line up */
  padding: 0.45rem 0.65rem 0.5rem;
  border-top: 2px solid var(--trace);
  font-size: 0.85rem;
  color: var(--silk-dim);
}
.vital { padding: 0.15rem 0.35rem; white-space: nowrap; }
.vital b { font-weight: 400; color: var(--silk); }
.vital.is-caution { background: var(--caution); color: var(--ink); }
.vital.is-fault { background: var(--fault); color: var(--ink); }
.vital.is-caution b,
.vital.is-fault b { color: inherit; }

/* A Pi that has stopped answering: keep its last known state, visibly stale. */
.panel.is-silent { border-style: dashed; }
.panel.is-silent .panel-note {
  padding: 0.1rem 0.5rem;
  background: var(--fault);
  color: var(--ink);
}
.panel.is-silent .checks,
.panel.is-silent .vitals { opacity: 0.4; }

.panel-hint { margin: 0; padding: 0.2rem 1rem 0.9rem; line-height: 1.45; }

.guide {
  max-width: 34rem;
  margin: 0;
  padding: 0.5rem 0;
  line-height: 1.5;
}
.guide code {
  display: block;
  margin-top: 0.6rem;
  font-family: inherit;
  color: var(--pad);
  overflow-wrap: anywhere;
}
</style>
</head>
<body>
<header class="verdict" id="verdict">
  <p class="verdict-text" id="verdict-text">Checking</p>
  <time class="clock" id="clock"></time>
</header>
<main class="panels" id="panels"></main>

<script>
"use strict";

const DEFAULT_PORT = 8787;
const POLL_MS = 15000;        // how often each Pi is asked for its status
const TIMEOUT_MS = 8000;      // how long to wait for an answer
const SILENT_AFTER = 2;       // missed answers in a row before a Pi counts as silent

// Vitals thresholds: [caution, fault]
const TEMP_C = [70, 80];
const DISK_PCT = [85, 95];
const MEMORY_PCT = [90, 101];

const hosts = (new URLSearchParams(location.search).get("hosts") || "")
  .split(",").map(s => s.trim()).filter(Boolean)
  .map(address => ({
    address,
    url: "http://" + (/:\d+$/.test(address) ? address : address + ":" + DEFAULT_PORT) + "/status",
    data: null,          // last good answer
    receivedAt: 0,       // performance.now() when it arrived
    lastHeard: null,     // Date of the last good answer
    failures: 0,
    tried: false,
  }));

const acknowledged = new Set();
let currentFaults = [];

// ------------------------------------------------------------ formatting

const esc = text => String(text).replace(/[&<>"']/g, c => "&#" + c.charCodeAt(0) + ";");
const plural = (n, word) => n + " " + word + (n === 1 ? "" : "s");

function duration(seconds) {
  if (seconds < 60) return "under a minute";
  if (seconds < 5400) return Math.round(seconds / 60) + " min";
  if (seconds < 172800) return plural(Math.round(seconds / 3600), "hour");
  return plural(Math.round(seconds / 86400), "day");
}
const ago = seconds => (seconds < 60 ? "just now" : duration(seconds) + " ago");
const until = seconds => (seconds <= 0 ? "due now" : "in " + duration(seconds));
const clockTime = date => date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const shortName = unit => unit.replace(/\.(service|timer)$/, "");

// ------------------------------------------------------------ evaluation
// Each check becomes { name, state, detail, level, alert }, where level is
// "ok", "caution" or "fault" and alert is the sentence for the verdict strip.

function unitCheck(unit, now) {
  const name = shortName(unit.name);
  const exit = unit.exit_status == null ? "" : ", exit code " + unit.exit_status;
  const fault = (state, detail, alert) => ({ name, state, detail, level: "fault", alert: name + " " + alert });
  const ok = (state, detail) => ({ name, state, detail, level: "ok" });

  if (unit.error) {
    return unit.state === "not-found"
      ? fault("not found", "check the unit name", "was not found")
      : fault("unknown", unit.error, "could not be checked");
  }

  if (unit.kind === "timer") {
    const next = unit.next_run ? "next " + until(unit.next_run - now) : "";
    if (unit.state !== "active") return fault("timer is off", "", "timer is off");
    if (unit.running) return ok("running now", next);
    if (unit.last_ok === false) {
      return fault("last run failed", ago(now - unit.last_run) + exit, "failed its last run");
    }
    if (unit.last_run) return ok("ran " + ago(now - unit.last_run), next);
    return ok("waiting for first run", next);
  }

  if (unit.kind === "oneshot") {
    return ok(unit.last_run ? "ran " + ago(now - unit.last_run) : "has not run since boot", "");
  }

  if (unit.ok) {
    if (unit.state === "activating") return ok("starting", "");
    return ok(unit.kind === "service" ? "running" : unit.state,
              unit.since ? "for " + duration(now - unit.since) : "");
  }
  const when = unit.since ? ago(now - unit.since) : "";
  if (unit.sub === "auto-restart") return fault("keeps restarting", when + exit, "keeps restarting");
  if (unit.state === "failed") return fault("failed", when + exit, "has failed");
  return fault("stopped", when, "has stopped");
}

function dnsCheck(check, now, labelTarget) {
  const name = "DNS lookup" + (labelTarget ? " via " + check.target : "");
  const checked = "checked " + ago(now - check.checked);
  if (check.ok) return { name, state: "answered in " + check.ms + " ms", detail: checked, level: "ok" };
  const state = /no reply/.test(check.detail) ? "no answer" : "error: " + check.detail;
  return { name, state, detail: checked, level: "fault", alert: "DNS lookups are failing" };
}

function vital(label, value, unit, limits, alertText) {
  if (value == null) return null;
  const level = value >= limits[1] ? "fault" : value >= limits[0] ? "caution" : "ok";
  return { label, text: value + unit, level, alert: level === "ok" ? null : alertText };
}

function evaluate(host) {
  const label = host.data ? host.data.name : host.address;
  const silent = host.failures >= SILENT_AFTER || (host.tried && !host.data && host.failures > 0);
  const view = { label, silent, pending: !host.tried, checks: [], vitals: [], alerts: [], note: "" };

  if (host.data) {
    const d = host.data;
    const now = d.time + (performance.now() - host.receivedAt) / 1000;  // the Pi's own clock
    view.checks = d.units.map(u => unitCheck(u, now))
      .concat(d.dns.map(c => dnsCheck(c, now, d.dns.length > 1)));
    view.vitals = [
      vital("CPU", d.temp_c == null ? null : Math.round(d.temp_c), " °C", TEMP_C,
            "CPU is at " + Math.round(d.temp_c) + " °C"),
      vital("memory", d.mem_used_pct, "%", MEMORY_PCT, "memory is " + d.mem_used_pct + "% used"),
      vital("disk", d.disk_used_pct, "%", DISK_PCT, "disk is " + d.disk_used_pct + "% full"),
    ].filter(Boolean);
    view.note = d.uptime == null ? "" : "up " + duration(d.uptime);
  }

  if (silent) {
    view.note = host.lastHeard ? "no answer since " + clockTime(host.lastHeard) : "no answer";
    view.alerts.push({ level: "fault", text: "No answer from " + label });
  } else {
    for (const item of view.checks.concat(view.vitals)) {
      if (item.alert) view.alerts.push({ level: item.level, text: label + ": " + item.alert });
    }
  }
  return view;
}

// ------------------------------------------------------------- rendering

function panelHtml(view) {
  const checks = view.checks.map(c => `
      <li class="check is-${c.level}">
        <span class="check-name">${esc(c.name)}</span>
        <span class="check-state">${esc(c.state)}${c.detail ? `<span class="check-detail">${esc(c.detail)}</span>` : ""}</span>
      </li>`).join("");
  const vitals = view.vitals.map(v =>
    `<span class="vital is-${v.level}">${esc(v.label)} <b>${esc(v.text)}</b></span>`).join("");
  const hint = view.silent && !view.checks.length
    ? `<p class="panel-hint">Check that it is powered on and that pi_status_agent is running on it.</p>`
    : "";
  return `
    <section class="panel${view.silent ? " is-silent" : ""}">
      <header class="panel-head">
        <h2 class="panel-name">${esc(view.label)}</h2>
        <p class="panel-note">${esc(view.pending ? "checking" : view.note)}</p>
      </header>
      ${hint}
      ${checks ? `<ul class="checks">${checks}</ul>` : ""}
      ${vitals ? `<p class="vitals">${vitals}</p>` : ""}
    </section>`;
}

function render() {
  const verdict = document.getElementById("verdict");
  const verdictText = document.getElementById("verdict-text");
  const panels = document.getElementById("panels");

  if (!hosts.length) {
    verdictText.textContent = "No Pis to watch yet";
    panels.innerHTML = `<p class="guide">Add the addresses of the Pis running pi_status_agent
      to the end of this page's address, separated by commas:
      <code>status_board.html?hosts=192.168.1.10,192.168.1.11</code></p>`;
    return;
  }

  const views = hosts.map(evaluate);
  panels.innerHTML = views.map(panelHtml).join("");

  const alerts = views.flatMap(v => v.alerts);
  const faults = alerts.filter(a => a.level === "fault");
  const worst = faults.length ? faults : alerts;
  let level = faults.length ? "fault" : alerts.length ? "caution" : "ok";

  if (worst.length) {
    verdictText.textContent = worst[0].text + (worst.length > 1 ? " and " + plural(worst.length - 1, "more problem") : "");
  } else if (views.some(v => v.pending)) {
    verdictText.textContent = "Checking";
  } else {
    verdictText.textContent = "Everything is running";
  }

  // An alert that clears and later returns should flash again.
  currentFaults = faults.map(a => a.text);
  for (const text of [...acknowledged]) {
    if (!currentFaults.includes(text)) acknowledged.delete(text);
  }
  const unacknowledged = currentFaults.some(text => !acknowledged.has(text));
  verdict.className = "verdict is-" + level + (unacknowledged ? " is-unacknowledged" : "");
}

function tickClock() {
  const now = new Date();
  document.getElementById("clock").textContent =
    now.toLocaleDateString([], { weekday: "short", day: "numeric", month: "short" }) + "  " + clockTime(now);
}

// ---------------------------------------------------------------- polling

async function poll(host) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);
  try {
    const response = await fetch(host.url, { signal: controller.signal, cache: "no-store" });
    if (!response.ok) throw new Error("HTTP " + response.status);
    host.data = await response.json();
    host.receivedAt = performance.now();
    host.lastHeard = new Date();
    host.failures = 0;
  } catch (err) {
    host.failures += 1;
  } finally {
    clearTimeout(timer);
    host.tried = true;
  }
  render();
}

function pollAll() {
  hosts.forEach(poll);
}

document.addEventListener("pointerdown", () => {
  currentFaults.forEach(text => acknowledged.add(text));
  render();
});

tickClock();
render();
pollAll();
setInterval(tickClock, 1000);
setInterval(pollAll, POLL_MS);
</script>
</body>
</html>
